<title>案例页工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">

<style>
:root{
  --ground:#EAEFF1; --surface:#FFFFFF; --surface-2:#F2F6F8; --sunk:#DEE7EA;
  --ink:#132029; --ink-2:#445866; --ink-3:#7C8F9B;
  --rule:#D2DDE2; --rule-soft:#E4EBEE;
  --accent:#0E747E; --accent-ink:#0A5A62; --accent-soft:#D8EBED;
  --warn:#A2451C; --warn-soft:#F7E7DE;
  --good:#2C7256; --good-soft:#DEEEE6;
  --shadow:0 1px 2px rgba(19,32,41,.06), 0 10px 26px -18px rgba(19,32,41,.34);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E181F; --surface:#16242D; --surface-2:#1B2C36; --sunk:#111D25;
    --ink:#DFE8EC; --ink-2:#A2B4BE; --ink-3:#778B97;
    --rule:#2A3D48; --rule-soft:#223440;
    --accent:#4FB4BC; --accent-ink:#83D2D8; --accent-soft:#12333A;
    --warn:#DB8B62; --warn-soft:#35211A;
    --good:#68B392; --good-soft:#163026;
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 10px 26px -18px rgba(0,0,0,.72);
  }
}
:root[data-theme="dark"]{
  --ground:#0E181F; --surface:#16242D; --surface-2:#1B2C36; --sunk:#111D25;
  --ink:#DFE8EC; --ink-2:#A2B4BE; --ink-3:#778B97;
  --rule:#2A3D48; --rule-soft:#223440;
  --accent:#4FB4BC; --accent-ink:#83D2D8; --accent-soft:#12333A;
  --warn:#DB8B62; --warn-soft:#35211A;
  --good:#68B392; --good-soft:#163026;
  --shadow:0 1px 2px rgba(0,0,0,.34), 0 10px 26px -18px rgba(0,0,0,.72);
}
*{box-sizing:border-box}
body{margin:0; padding-bottom:var(--dock-h,0px); background:var(--ground); color:var(--ink); font-size:15px; line-height:1.6;
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit; padding:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-radius:4px}
[contenteditable]{outline:none}
[contenteditable]:focus{background:var(--accent-soft); border-radius:3px;
  box-shadow:0 0 0 2px var(--accent-soft)}

/* ---- header ---- */
header{background:var(--surface); border-bottom:1px solid var(--rule); padding:14px 22px;
  display:flex; gap:20px; align-items:center; flex-wrap:wrap}
header h1{margin:0; font-size:17px; font-weight:700}
header .sub{font-size:12px; color:var(--ink-3)}
.spacer{flex:1}
.btn{border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
  border-radius:7px; padding:7px 13px; font-size:13px}
.btn:hover{border-color:var(--accent); color:var(--accent-ink)}
.btn.on{background:var(--accent); border-color:var(--accent); color:#fff}
.stat{font-size:12px; color:var(--ink-3); white-space:nowrap}
.stat b{font-family:"IBM Plex Mono",monospace; font-size:15px; color:var(--ink);
  font-variant-numeric:tabular-nums}
.stat.a b{color:var(--accent-ink)} .stat.w b{color:var(--warn)}

/* ---- shell ---- */
.shell{display:grid; grid-template-columns:262px 1fr; align-items:start}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
aside{position:sticky; top:0; max-height:100vh; overflow-y:auto; background:var(--surface-2);
  border-right:1px solid var(--rule); padding:16px 14px 140px}
.dirhead{display:flex; align-items:center; gap:8px; margin-bottom:12px}
.dirhead h2{margin:0; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-weight:500}

#dir{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px}
.cat{background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:9px 10px}
.chead{display:flex; align-items:center; gap:5px; margin-bottom:7px}
.cname{font-size:12.5px; font-weight:500; flex:1; min-width:0}
.mini{width:19px; height:19px; border-radius:5px; background:var(--sunk); color:var(--ink-3);
  font-size:12px; line-height:1; display:grid; place-items:center; flex:none}
.mini:hover{background:var(--accent); color:#fff}
.mini.del:hover{background:var(--warn)}
.multi{font-family:"IBM Plex Mono",monospace; font-size:9px; padding:1px 5px; border-radius:4px;
  background:var(--sunk); color:var(--ink-3); flex:none}
.cat[data-multi="1"] .multi::after{content:"多选"}
.cat[data-multi="0"] .multi::after{content:"单选"}
.tlist{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:4px}
.tag{display:flex; align-items:center; gap:3px; border:1px solid var(--rule);
  border-radius:999px; padding:2px 4px 2px 8px; background:var(--surface); font-size:11.5px}
.tag .tname{min-width:10px}
.tag[data-local-filter="1"]{background:var(--accent); border-color:var(--accent); color:#fff}
.tag[data-local-filter="1"] .mini{background:rgba(255,255,255,.25); color:#fff}
.tag .mini{width:15px; height:15px; font-size:10px}
.emptytags{font-size:11px; color:var(--ink-3)}

/* ---- toolbar ---- */
.toolbar{position:sticky; top:0; z-index:6; background:var(--ground);
  border-bottom:1px solid var(--rule); padding:12px 20px; display:flex; gap:10px;
  align-items:center; flex-wrap:wrap}
#q{flex:1 1 220px; min-width:170px; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink); border-radius:7px; padding:8px 12px; font-size:14px; font-family:inherit}
.chipbtn{border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
  border-radius:999px; padding:5px 11px; font-size:12.5px}
.chipbtn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.count{font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---- grid ---- */
main{padding:16px 20px 40px}
/* The dock is fixed, so the page reserves room for it rather than
   letting it cover the last rows of cards — which made them unclickable. */

.grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:9px;
  overflow:hidden; display:flex; flex-direction:column; position:relative}
.card[data-local-hidden="1"]{display:none}
.card[data-local-pick="1"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.thumb{aspect-ratio:16/9; background:var(--sunk); position:relative}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.uid{position:absolute; left:6px; top:6px; font-family:"IBM Plex Mono",monospace; font-size:10px;
  background:rgba(11,20,26,.78); color:#fff; padding:1px 6px; border-radius:4px}
.pick{position:absolute; right:6px; top:6px; width:24px; height:24px; border-radius:6px;
  background:rgba(11,20,26,.6); color:#fff; border:1px solid rgba(255,255,255,.6);
  display:grid; place-items:center; font-size:13px}
.card[data-local-pick="1"] .pick{background:var(--accent); border-color:var(--accent)}
.card[data-conf="low"] .thumb::after{content:"标题待确认"; position:absolute; left:6px; bottom:6px;
  font-size:10px; background:var(--warn); color:#fff; padding:1px 6px; border-radius:4px}
.cardbody{padding:9px 11px 11px; display:flex; flex-direction:column; gap:7px; flex:1}
.ttl{font-size:12.5px; font-weight:500; line-height:1.45; min-height:1.4em}
.chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:auto; min-height:19px}
.tg{display:inline-flex; align-items:center; gap:2px; background:var(--accent-soft);
  color:var(--accent-ink); border-radius:4px; padding:1px 3px 1px 6px; font-size:10.5px}
.tg .x{width:13px; height:13px; border-radius:3px; font-size:10px; line-height:1;
  display:grid; place-items:center; color:var(--accent-ink); opacity:.55}
.tg .x:hover{background:var(--warn); color:#fff; opacity:1}
.untag{font-size:10.5px; color:var(--ink-3)}
.card:has(.chips:not(:empty)) .untag{display:none}
.empty{grid-column:1/-1; padding:56px; text-align:center; color:var(--ink-3)}

/* ---- dock ---- */
.dock{position:fixed; left:0; right:0; bottom:0; z-index:12; background:var(--surface);
  border-top:1px solid var(--rule); box-shadow:var(--shadow); padding:12px 20px;
  max-height:42vh; overflow-y:auto}
.dockhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px}
.dockhead .n{font-size:13.5px; font-weight:500; white-space:nowrap}
.dockhead .n b{font-family:"IBM Plex Mono",monospace; color:var(--accent-ink); font-size:16px}
.palette{display:flex; flex-direction:column; gap:8px}
.prow{display:flex; gap:7px; align-items:baseline; flex-wrap:wrap}
.plabel{font-size:11px; color:var(--ink-3); width:76px; flex:none; text-align:right}
.pt{border:1px solid var(--rule); background:var(--surface-2); color:var(--ink-2);
  border-radius:999px; padding:3px 10px; font-size:12px}
.pt:hover{border-color:var(--accent); color:var(--accent-ink)}
.pt[data-state="all"]{background:var(--accent); border-color:var(--accent); color:#fff}
.pt[data-state="some"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.cmd{background:var(--sunk); border-radius:7px; padding:8px 11px; font-family:"IBM Plex Mono",monospace;
  font-size:11px; color:var(--ink-2); overflow-x:auto; white-space:nowrap; flex:1 1 260px; min-width:0}
.solid{border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:7px;
  padding:7px 13px; font-size:13px; white-space:nowrap}
.solid:hover{background:var(--accent-ink)}
.hint{font-size:11.5px; color:var(--ink-3)}
[artifact-sync-state="off"]{outline:2px dashed var(--warn)}
#offbanner{display:none; background:var(--warn-soft); color:var(--warn); padding:8px 20px;
  font-size:13px; border-bottom:1px solid var(--warn)}
</style>

<div id="offbanner">同步已关闭 —— 这个视图的改动不会被保存。请刷新页面。</div>

<header>
  <div>
    <h1>案例页工作台</h1>
    <div class="sub" id="src"></div>
  </div>
  <div class="spacer"></div>
  <span class="stat"><b id="s-total">0</b> 总页数</span>
  <span class="stat a"><b id="s-tagged">0</b> 已打标</span>
  <span class="stat w"><b id="s-untagged">0</b> 未打标</span>
  <button class="btn" id="export">导出 JSON</button>
</header>

<div class="shell">
  <aside>
    <div class="dirhead">
      <h2>标签目录</h2>
      <div class="spacer"></div>
      <button class="btn" id="addcat" style="padding:4px 9px; font-size:12px">+ 类别</button>
    </div>
    <ul artifact-sync id="dir"><!--__DIRECTORY__--></ul>
    <p class="hint" style="margin-top:14px">点标签名可直接改字；点圆点按标签筛选；<b>×</b> 删除。改动自动保存并同步给所有人。</p>
  </aside>

  <div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="搜索标题…  按 / 聚焦" autocomplete="off">
      <button class="chipbtn" data-view="all" aria-pressed="true">全部</button>
      <button class="chipbtn" data-view="untagged" aria-pressed="false">未打标</button>
      <button class="chipbtn" data-view="lowtitle" aria-pressed="false">标题待确认</button>
      <button class="chipbtn" data-view="picked" aria-pressed="false">已选</button>
      <span class="count" id="count"></span>
      <button class="btn" id="pickall" style="padding:5px 11px; font-size:12.5px">全选当前</button>
      <button class="btn" id="clear" style="padding:5px 11px; font-size:12.5px">清除</button>
    </div>
    <main><div class="grid" id="grid"><!--__CARDS__--></div></main>
  </div>
</div>

<div id="dock"></div>

<script>
const META = /*__META__*/null;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];

const cards = () => $$("#grid .card");
const picked = () => cards().filter(c => c.dataset.localPick === "1");
const chipsOf = c => $(".chips", c);
const tagsOf = c => $$(".tg", c).map(t => t.dataset.tag);
const view = { mode: "all", q: "", filters: new Set() };

/* ---------- tag directory helpers (read from the synced DOM) ---------- */
function directory(){
  return $$("#dir .cat").map(cat => ({
    id: cat.dataset.cat,
    name: $(".cname", cat).textContent.trim(),
    multi: cat.dataset.multi === "1",
    el: cat,
    tags: $$(".tag", cat).map(t => ({
      id: t.dataset.tag, name: $(".tname", t).textContent.trim(), el: t })),
  }));
}
const tagIndex = () => Object.fromEntries(
  directory().flatMap(c => c.tags.map(t => [t.id, {name: t.name, cat: c.id, multi: c.multi}])));

function nextId(prefix, selector, attr){
  const used = $$(selector).map(e => parseInt((e.dataset[attr] || "").slice(prefix.length), 10) || 0);
  return prefix + String(Math.max(0, ...used) + 1).padStart(3, "0");
}

/* ---------- markup builders (only ever called inside a gesture) ---------- */
function tagLi(id, name){
  const li = document.createElement("li");
  li.className = "tag"; li.dataset.tag = id;
  const dot = document.createElement("button");
  dot.className = "mini"; dot.dataset.act = "filter"; dot.textContent = "●"; dot.title = "按此标签筛选";
  const span = document.createElement("span");
  span.className = "tname"; span.contentEditable = "true"; span.spellcheck = false; span.textContent = name;
  const del = document.createElement("button");
  del.className = "mini del"; del.dataset.act = "deltag"; del.textContent = "×"; del.title = "删除标签";
  li.append(dot, span, del);
  return li;
}
function chip(id, name){
  const s = document.createElement("span");
  s.className = "tg"; s.dataset.tag = id;
  const n = document.createElement("span"); n.className = "n"; n.textContent = name;
  const x = document.createElement("button"); x.className = "x"; x.dataset.act = "untag"; x.textContent = "×";
  s.append(n, x);
  return s;
}

/* ---------- applying tags (mutates synced DOM directly) ---------- */
function applyTag(card, tagId, on){
  const idx = tagIndex(), info = idx[tagId];
  if (!info) return;
  const chips = chipsOf(card);
  const existing = $(`.tg[data-tag="${tagId}"]`, chips);
  if (on && !existing){
    if (!info.multi){
      $$(".tg", chips).forEach(t => { if ((idx[t.dataset.tag] || {}).cat === info.cat) t.remove(); });
    }
    chips.append(chip(tagId, info.name));
  } else if (!on && existing){
    existing.remove();
  }
}

/* ---------- local-only view state ---------- */
function refresh(){
  const idx = tagIndex();
  const q = view.q.trim().toLowerCase();
  let shown = 0;
  cards().forEach(c => {
    const tags = tagsOf(c);
    let ok = true;
    if (view.mode === "untagged") ok = tags.length === 0;
    else if (view.mode === "lowtitle") ok = c.dataset.conf === "low";
    else if (view.mode === "picked") ok = c.dataset.localPick === "1";
    if (ok && view.filters.size) ok = [...view.filters].every(f => tags.includes(f));
    if (ok && q){
      const hay = ($(".ttl", c).textContent + " " + c.dataset.uid + " " +
                   tags.map(t => (idx[t] || {}).name || "").join(" ")).toLowerCase();
      ok = q.split(/\s+/).filter(Boolean).every(t => hay.includes(t));
    }
    c.dataset.localHidden = ok ? "0" : "1";
    if (ok) shown++;
  });
  const total = cards().length;
  const tagged = cards().filter(c => tagsOf(c).length).length;
  $("#s-total").textContent = total;
  $("#s-tagged").textContent = tagged;
  $("#s-untagged").textContent = total - tagged;
  $("#count").textContent = `${shown} / ${total} 页`;
  $("#grid").dataset.empty = shown ? "0" : "1";
  renderDock();
}

function reserveDockSpace(){
  const panel = $("#dock .dock");
  document.documentElement.style.setProperty(
    "--dock-h", (panel ? panel.getBoundingClientRect().height + 12 : 0) + "px");
}

function renderDock(){
  const sel = picked();
  const dock = $("#dock");
  if (!sel.length){ dock.innerHTML = ""; reserveDockSpace(); return; }
  const uids = sel.map(c => c.dataset.uid);
  const rows = directory().map(cat => {
    if (!cat.tags.length) return "";
    const btns = cat.tags.map(t => {
      const n = sel.filter(c => tagsOf(c).includes(t.id)).length;
      const state = n === 0 ? "none" : (n === sel.length ? "all" : "some");
      return `<button class="pt" data-apply="${t.id}" data-state="${state}">${esc(t.name)}</button>`;
    }).join("");
    return `<div class="prow"><span class="plabel">${esc(cat.name)}</span>${btns}</div>`;
  }).join("");
  const cmd = `python3 -m deckorganizer compose --library library --pages "${uids.join(",")}" --out 新案例.pdf`;
  dock.innerHTML = `<div class="dock">
    <div class="dockhead">
      <span class="n">已选 <b>${sel.length}</b> 页</span>
      <span class="hint">点标签给选中的页批量打标；再点一次取消</span>
      <div class="spacer"></div>
      <code class="cmd" id="cmd">${esc(cmd)}</code>
      <button class="solid" id="copycmd">复制组页命令</button>
      <button class="btn" id="unpick">取消选择</button>
    </div>
    <div class="palette">${rows || '<span class="hint">标签目录还是空的 —— 先在左侧新建标签</span>'}</div>
  </div>`;
  reserveDockSpace();
}

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;

  const act = t.closest("[data-act]")?.dataset.act;
  if (act === "filter"){
    const li = t.closest(".tag"), id = li.dataset.tag;
    const on = li.dataset.localFilter === "1";
    li.dataset.localFilter = on ? "0" : "1";
    on ? view.filters.delete(id) : view.filters.add(id);
    refresh(); return;
  }
  if (act === "deltag"){
    const li = t.closest(".tag"), id = li.dataset.tag;
    $$(`#grid .tg[data-tag="${id}"]`).forEach(c => c.remove());
    view.filters.delete(id);
    li.remove(); refresh(); return;
  }
  if (act === "addtag"){
    const cat = t.closest(".cat");
    const li = tagLi(nextId("t", "#dir .tag", "tag"), "新标签");
    $(".tlist", cat).append(li);
    $(".emptytags", cat)?.remove();
    const span = $(".tname", li);
    span.focus(); getSelection().selectAllChildren(span);
    return;
  }
  if (act === "delcat"){
    const cat = t.closest(".cat");
    const ids = $$(".tag", cat).map(x => x.dataset.tag);
    ids.forEach(id => { $$(`#grid .tg[data-tag="${id}"]`).forEach(c => c.remove()); view.filters.delete(id); });
    cat.remove(); refresh(); return;
  }
  if (act === "multi"){
    const cat = t.closest(".cat");
    cat.dataset.multi = cat.dataset.multi === "1" ? "0" : "1";
    return;
  }
  if (act === "untag"){
    t.closest(".tg").remove(); refresh(); return;
  }
  if (act === "pick"){
    const card = t.closest(".card");
    card.dataset.localPick = card.dataset.localPick === "1" ? "0" : "1";
    refresh(); return;
  }

  if (t.closest("#addcat")){
    const cat = document.createElement("li");
    cat.className = "cat"; cat.dataset.cat = nextId("c", "#dir .cat", "cat"); cat.dataset.multi = "1";
    cat.innerHTML = `<div class="chead">
        <span class="cname" contenteditable="true" spellcheck="false">新类别</span>
        <button class="multi" data-act="multi" title="切换单选/多选"></button>
        <button class="mini" data-act="addtag" title="新增标签">+</button>
        <button class="mini del" data-act="delcat" title="删除类别">×</button>
      </div><ul class="tlist"></ul>`;
    $("#dir").append(cat);
    const span = $(".cname", cat);
    span.focus(); getSelection().selectAllChildren(span);
    return;
  }
  const applyBtn = t.closest("[data-apply]");
  if (applyBtn){
    const id = applyBtn.dataset.apply, sel = picked();
    const on = applyBtn.dataset.state !== "all";
    sel.forEach(c => applyTag(c, id, on));
    refresh(); return;
  }
  const viewBtn = t.closest("[data-view]");
  if (viewBtn){
    view.mode = viewBtn.dataset.view;
    $$("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b === viewBtn)));
    refresh(); return;
  }
  if (t.closest("#pickall")){
    cards().filter(c => c.dataset.localHidden !== "1").forEach(c => c.dataset.localPick = "1");
    refresh(); return;
  }
  if (t.closest("#unpick")){ cards().forEach(c => c.dataset.localPick = "0"); refresh(); return; }
  if (t.closest("#clear")){
    view.q = ""; $("#q").value = ""; view.mode = "all"; view.filters.clear();
    $$("#dir .tag").forEach(l => l.dataset.localFilter = "0");
    $$("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === "all")));
    refresh(); return;
  }
  if (t.closest("#copycmd")){
    const b = t.closest("#copycmd");
    navigator.clipboard?.writeText($("#cmd").textContent).then(
      () => { b.textContent = "已复制"; setTimeout(() => b.textContent = "复制组页命令", 1400); },
      () => { b.textContent = "请手动复制"; });
    return;
  }
  if (t.closest("#export")) doExport(t.closest("#export"));
});

$("#q").addEventListener("input", e => { view.q = e.target.value; refresh(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)
      && !document.activeElement.isContentEditable){ e.preventDefault(); $("#q").focus(); }
});
/* Renaming a tag in the directory renames it everywhere it is in use. */
document.addEventListener("input", e => {
  const span = e.target.closest?.(".tname");
  if (!span) return;
  const id = span.closest(".tag").dataset.tag, name = span.textContent.trim();
  $$(`#grid .tg[data-tag="${id}"] .n`).forEach(n => { n.textContent = name; });
  renderDock();
});
document.addEventListener("claude:sync-off", () => { $("#offbanner").style.display = "block"; });

/* ---------- export ---------- */
async function doExport(btn){
  const payload = {
    exportedAt: new Date().toISOString(),
    categories: directory().map(c => ({
      id: c.id, name: c.name, multi: c.multi,
      tags: c.tags.map(t => ({id: t.id, name: t.name})),
    })),
    pages: Object.fromEntries(cards().map(c => [c.dataset.uid, {
      title: $(".ttl", c).textContent.trim(),
      tags: tagsOf(c),
    }])),
  };
  const text = JSON.stringify(payload, null, 1);
  const downloads = await (window.claude?.use?.("downloads") ?? Promise.resolve(null));
  if (downloads){
    try {
      await downloads.save({filename: "deck-organizer-edits.json", data: text});
      btn.textContent = "已导出"; setTimeout(() => btn.textContent = "导出 JSON", 1600);
      return;
    } catch (err) { /* viewer declined or unavailable — fall through to clipboard */ }
  }
  navigator.clipboard?.writeText(text).then(
    () => { btn.textContent = "已复制到剪贴板"; setTimeout(() => btn.textContent = "导出 JSON", 1800); },
    () => { btn.textContent = "导出失败"; });
}

window.addEventListener("resize", reserveDockSpace);
$("#src").textContent = META.docs.map(d => `${d.id} · ${d.title}（${d.pages}页）`).join("　｜　");
refresh();
</script>
